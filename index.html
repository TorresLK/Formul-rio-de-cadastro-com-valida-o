<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form onsubmit="alert('Formulario enviado com sucesso!') ; return false;">
        <label>Nome:</label>
        <input type="text" onblur="if(this.value==='') {alert('Campo nome obrigatório!')}"><br><br>

        <label>Email:</label>
        <input type="email" onchange="alert('Email alterado!')"><br><br>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
